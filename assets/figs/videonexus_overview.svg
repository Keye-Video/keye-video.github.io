<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="VideoNexus architecture: decoupling planner reasoning from isolated perception sub-agents">
  <!-- VideoNexus 框架示意图（Peach Fuzz 配色体系） -->
  <rect width="920" height="500" fill="#FFF8F5"/>
  <rect x="28" y="28" width="864" height="444" rx="14" fill="#FFFFFF" stroke="#E6D8D1"/>

  <text x="56" y="72" font-family="Hanken Grotesk, sans-serif" font-size="18" font-weight="700" fill="#221916">VideoNexus: Separating Video Perception from the Reasoning Context</text>
  <text x="56" y="96" font-family="Hanken Grotesk, sans-serif" font-size="13.5" fill="#74655E">Training-free architecture · Isolated native audio-video sub-agents exchange compact grounded evidence with the planner</text>

  <!-- 左侧：Planner Context -->
  <g transform="translate(56, 130)">
    <rect width="252" height="252" rx="12" fill="#FFF8F5" stroke="#F87C4C" stroke-width="1.8"/>
    <rect x="18" y="18" width="114" height="24" rx="12" fill="#FEDCCC"/>
    <text x="75" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#5A200B">PLANNER</text>
    <text x="18" y="68" font-family="Hanken Grotesk, sans-serif" font-size="16" font-weight="700" fill="#221916">Evidence-Driven Reasoning</text>
    <text x="18" y="92" font-family="Hanken Grotesk, sans-serif" font-size="13" fill="#4A3E39">Controls where to inspect,</text>
    <text x="18" y="110" font-family="Hanken Grotesk, sans-serif" font-size="13" fill="#4A3E39">what detail to resolve, and</text>
    <text x="18" y="128" font-family="Hanken Grotesk, sans-serif" font-size="13" fill="#4A3E39">how densely to sample.</text>

    <rect x="18" y="152" width="216" height="80" rx="8" fill="#FFFFFF" stroke="#E6D8D1"/>
    <text x="30" y="175" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#D95726">Compact Reasoning Context</text>
    <text x="30" y="196" font-family="JetBrains Mono, monospace" font-size="11" fill="#4A3E39">• Zero raw frame bloat</text>
    <text x="30" y="214" font-family="JetBrains Mono, monospace" font-size="11" fill="#4A3E39">• Iterative search &amp; verify</text>
  </g>

  <!-- 中间：双向协议箭头 -->
  <g>
    <path d="M318 214H396" stroke="#F87C4C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M390 208L399 214L390 220" stroke="#F87C4C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="358" y="194" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600" fill="#D95726">Query +</text>
    <text x="358" y="207" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600" fill="#D95726">Interval &amp; FPS</text>

    <path d="M398 296H320" stroke="#221916" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <path d="M326 290L317 296L326 302" stroke="#221916" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="358" y="318" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600" fill="#221916">Compact Grounded</text>
    <text x="358" y="332" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600" fill="#221916">Evidence</text>
  </g>

  <!-- 中右：Isolated Perception Sub-Agents -->
  <g transform="translate(408, 130)">
    <rect width="236" height="252" rx="12" fill="#1F1816"/>
    <rect x="18" y="18" width="160" height="24" rx="12" fill="#463934"/>
    <text x="98" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#FEDCCC">PERCEPTION SUB-AGENTS</text>
    <text x="18" y="68" font-family="Hanken Grotesk, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Isolated Video Contexts</text>

    <rect x="18" y="88" width="200" height="44" rx="7" fill="#322724"/>
    <text x="30" y="108" font-family="JetBrains Mono, monospace" font-size="11" fill="#F87C4C">Sub-Agent #1 · [04:10–05:30]</text>
    <text x="30" y="124" font-family="Hanken Grotesk, sans-serif" font-size="11.5" fill="#F2EAE7">Native audio-video scan</text>

    <rect x="18" y="142" width="200" height="44" rx="7" fill="#322724"/>
    <text x="30" y="162" font-family="JetBrains Mono, monospace" font-size="11" fill="#F87C4C">Sub-Agent #2 · [21:04–21:18]</text>
    <text x="30" y="178" font-family="Hanken Grotesk, sans-serif" font-size="11.5" fill="#F2EAE7">High-FPS detail verification</text>

    <rect x="18" y="196" width="200" height="38" rx="7" fill="#463934"/>
    <text x="118" y="219" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="12" font-weight="600" fill="#FEDCCC">Discarded after evidence extraction</text>
  </g>

  <!-- 最右：实测结果卡片 -->
  <g transform="translate(668, 130)">
    <rect width="196" height="252" rx="12" fill="#FFF0E8" stroke="#F87C4C"/>
    <text x="18" y="36" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#B54318">KEY RESULTS</text>

    <text x="18" y="82" font-family="Hanken Grotesk, sans-serif" font-size="30" font-weight="700" fill="#221916">88.6%</text>
    <text x="18" y="100" font-family="Hanken Grotesk, sans-serif" font-size="12.5" fill="#4A3E39">Full LVBench accuracy</text>
    <text x="18" y="116" font-family="Hanken Grotesk, sans-serif" font-size="11.5" fill="#74655E">(+3.6 static / +1.1 agentic)</text>

    <line x1="18" y1="134" x2="178" y2="134" stroke="#E6D8D1"/>

    <text x="18" y="168" font-family="Hanken Grotesk, sans-serif" font-size="26" font-weight="700" fill="#D95726">44%</text>
    <text x="18" y="185" font-family="Hanken Grotesk, sans-serif" font-size="12.5" fill="#4A3E39">Measured API cost</text>

    <line x1="18" y1="200" x2="178" y2="200" stroke="#E6D8D1"/>

    <text x="18" y="232" font-family="Hanken Grotesk, sans-serif" font-size="20" font-weight="700" fill="#221916">+8.5 pts</text>
    <text x="108" y="232" font-family="Hanken Grotesk, sans-serif" font-size="12" fill="#4A3E39">Video-GAIA</text>
  </g>

  <text x="56" y="428" font-family="JetBrains Mono, monospace" font-size="12" fill="#74655E">arXiv:2611.21392v1 · Keye Video Team · Gemini 3.8 Flash &amp; Kimi K3 evaluations</text>
</svg>
